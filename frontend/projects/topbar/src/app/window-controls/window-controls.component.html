@if (showControls()) {
  <app-window-control-button (click)="minimize()"
    >Minimize</app-window-control-button
  >
  <app-window-control-button (click)="maximize()"
    >Maximize</app-window-control-button
  >
  <app-window-control-button (click)="closeApp()"
    >Close</app-window-control-button
  >
}
