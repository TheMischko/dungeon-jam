@if (title()) {
  <h3 class="menu-title">{{ title() }}</h3>
}
@for (config of config(); track config.text) {
  <button
    mat-menu-item
    (click)="actionClicked(item(), config, $event)"
    [ngClass]="$safeNavigationMigration(config?.cssClasses)"
    [title]="''"
    [matTooltip]="config?.tooltip ?? ''"
  >
    @if (config.icon) {
      <lucide-icon [img]="config.icon"></lucide-icon>
    }
    <span>{{ config.text }}</span>
  </button>
}
