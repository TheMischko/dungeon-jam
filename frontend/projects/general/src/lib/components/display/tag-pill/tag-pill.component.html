<div
  class="tag"
  [ngStyle]="pillStyles()"
  [ngClass]="{ highlighted: highlighted() }"
>
  <span>{{ tag().title }}</span>
  @if (removable()) {
    <button class="remove-button" (click)="removed.emit(this.tag())">
      <lucide-icon [img]="removeIcon" [size]="16"></lucide-icon>
    </button>
  }
</div>
