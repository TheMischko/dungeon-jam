<mat-form-field class="wrapper">
  <mat-label>{{ label() }}</mat-label>
  <mat-select
    [value]="value()"
    (selectionChange)="setValueFromSelect($event)"
    [disabled]="disabled()"
  >
    @if (!loading()) {
      @for (playlist of playlists(); track playlist.id) {
        <mat-option [value]="playlist">{{ playlist.name }}</mat-option>
      }
    }
  </mat-select>
</mat-form-field>
