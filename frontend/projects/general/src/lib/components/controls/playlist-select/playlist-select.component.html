<mat-form-field class="wrapper" appearance="outline">
  <mat-label>{{ label() }}</mat-label>
  <input type="text" matInput [formControl]="textControl" [matAutocomplete]="auto" (blur)="onBlur()">
  <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn" (optionSelected)="setValueFromSelect($event)">
    @if (!loading()) {
      @if (!playlists().length) {
        <mat-option [disabled]="true">There are no playlists yet.</mat-option>
      } @else {
        <mat-option [value]="null">None</mat-option>
      }
      @for (option of playlistOptions(); track option.playlist.id) {
        <mat-option [value]="option.playlist">
          @let parent = getPlaylistParent(option.playlist);
          <div class="playlist-option">
            <span class="depth-spacer" [ngStyle]="getDepthIndent(option.depth)"></span>
            <div class="playlist-name">{{ option.playlist.name }}</div>
            @if (parent) {
              <div class="parent-name">({{parent.name}})</div>
            }
          </div>
        </mat-option>
      }
    }
  </mat-autocomplete>
</mat-form-field>
