<mat-form-field class="wrapper" appearance="outline">
  <mat-label>{{ label() }}</mat-label>
  <mat-select
    [value]="value()"
    (selectionChange)="setValueFromSelect($event)"
    [disabled]="disabled()"
  >
    @if (!loading()) {
      @if (!playlists().length) {
        <mat-option [disabled]="true">There are no playlists yet.</mat-option>
      } @else {
        <mat-option [value]="null">None</mat-option>
      }
      @for (playlist of playlistOptions(); track playlist.id) {
        <mat-option [value]="playlist">{{ playlist.name }}</mat-option>
      }
    }
  </mat-select>
</mat-form-field>
