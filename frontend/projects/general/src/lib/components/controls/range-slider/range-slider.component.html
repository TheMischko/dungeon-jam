@if (prefix()) {
  @if (prefixIcon()) {
    <lucide-icon
      class="prefix side-icon"
      [img]="prefixIcon()"
      [size]="iconSize()"
    ></lucide-icon>
  } @else {
    <span class="prefix side-text">{{ prefix() }}</span>
  }
}
<mat-slider
  [min]="minValue()"
  [max]="maxValue()"
  [step]="stepSize()"
  [disableRipple]="true"
  (input)="changeValue($event)"
  class="slider"
>
  <input matSliderThumb [value]="value()" />
</mat-slider>
@if (suffix()) {
  @if (suffixIcon()) {
    <lucide-icon
      class="prefix side-icon"
      [img]="suffixIcon()"
      [size]="iconSize()"
    ></lucide-icon>
  } @else {
    <span class="prefix side-text">{{ suffix() }}</span>
  }
}
