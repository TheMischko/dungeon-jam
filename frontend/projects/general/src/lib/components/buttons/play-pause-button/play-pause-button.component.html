@if(state() === 'pause'){
<lib-icon-button
  [icon]="pauseIcon"
  [type]="type()"
  [size]="size()"
  [label]="label()"
  (click)="clicked()"
></lib-icon-button>
} @else {
<lib-icon-button
  [icon]="playIcon"
  [type]="type()"
  [size]="size()"
  [label]="label()"
  (click)="clicked()"
></lib-icon-button>
}
