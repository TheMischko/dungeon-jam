<div class="toast-wrapper">
  <div class="toast" [ngClass]="getToastTypeClass()">
    @if (data.title.length) {
      <h3 class="toast-title">{{ data.title }}</h3>
    }
    @if (data.description) {
      <p class="toast-message">{{ data.description }}</p>
    }
    <lib-icon-button
      class="dismiss-button"
      [icon]="dismissIcon"
      color="neutral"
      (clicked)="hideToast()"
    ></lib-icon-button>
  </div>
</div>
