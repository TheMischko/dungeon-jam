<div class="item" [class.active]="item().active" (click)="onClick()">
  <div class="item-title">
    {{ item().title }}
  </div>
  @if(hasChildren()){
    <button class="toggle-button" (click)="toggleExpandState($event)">
      <svg [lucideIcon]="toggleIcon()" />
    </button>
  }
</div>

@if (expanded()) {
  @for (child of children(); track child.title){
    <div class="child-item" [class.active]="child.active" (click)="redirectChild(child)">{{ child.title }}</div>
  }
}
