<div class="item" [class.active]="item().active" (click)="onClick()">
  <div class="item-title">
    {{item().title}}
  </div>
  @if(hasChildren()){
    <button class="toggle-button" (click)="expanded.set(!expanded())">
      <lucide-icon [img]="toggleIcon()" />
    </button>
  }
</div>
@if (expanded()) {
  @for (child of children(); track child.title){
    <div class="child-item">{{child.title}}</div>
  }
}
