<h1>Library</h1>
<app-files-drop-in-zone (audioDropped)="openUploadDialog($event)">
  <div class="upload-info">
    <h3>Adding new tracks</h3>
    <p>To add new tracks just drop the audio files onto the Library table or click the button below.</p>
  </div>
  <button class="upload-button" mat-flat-button (click)="beginUploadWithDialogSelection()">Upload new tracks</button>
  <app-songs-table
    [tracks]="displayTracks()"
    [playingTrackId]="playingTrackId()"
    [actionsMenuConfig]="songMenuActions()"
    [loading]="tracksLoading()"
    (playTrack)="playTrack($event)"
    (pauseTrack)="pauseTrack()"
    (queryChange)="currentQuery.set($event)"
    (actionMenuClosed)="actionsClosed($event)"
  ></app-songs-table>
  </app-files-drop-in-zone>
