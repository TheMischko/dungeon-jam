<h1>Library</h1>
<app-songs-drop-in-zone (dropped)="openUploadDialog($event)">
  <div class="upload-info">
    <h3>Adding new tracks</h3>
    <p>To add new tracks just drop the audio files onto the Library table.</p>
  </div>
  <app-songs-table
    [tracks]="displayTracks()"
    [playingTrackId]="playingTrackId()"
    [actionsMenuConfig]="songMenuActions()"
    [loading]="tracksLoading()"
    (playTrack)="playTrack($event)"
    (pauseTrack)="pauseTrack()"
    (queryChange)="currentQuery.set($event)"
    (actionMenuClosed)="actionsClosed($event)"
    (filterChange)="setFilters($event)"
  ></app-songs-table>
</app-songs-drop-in-zone>
