<mat-table [dataSource]="tracks()" class="table">
  <ng-container matColumnDef="play">
    <mat-header-cell *matHeaderCellDef></mat-header-cell>
    <mat-cell mat-cell *matCellDef="let row">
      @if (isActiveRow(row) && !isTrackPlaying(row)) {
      <button mat-icon-button (click)="play(row)">
        <lucide-icon class="icon-small" [img]="PlayIcon"></lucide-icon>
      </button>
      } @else if (isTrackPlaying(row)){
      <button mat-icon-button (click)="pause()">
        <lucide-icon class="icon-small" [img]="PauseIcon"></lucide-icon>
      </button>
      }
    </mat-cell>
  </ng-container>
  <ng-container matColumnDef="title">
    <mat-header-cell *matHeaderCellDef>Title</mat-header-cell>
    <mat-cell mat-cell *matCellDef="let row">{{ row.name }}</mat-cell>
  </ng-container>
  <ng-container matColumnDef="author">
    <mat-header-cell mat-header-cell *matHeaderCellDef>Author</mat-header-cell>
    <mat-cell *matCellDef="let row">{{ row.author }}</mat-cell>
  </ng-container>
  <ng-container matColumnDef="duration">
    <mat-header-cell mat-header-cell *matHeaderCellDef>Length</mat-header-cell>
    <mat-cell *matCellDef="let row">{{
      row.duration | trackDuration
    }}</mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
  <mat-row
    *matRowDef="let row; columns: displayedColumns"
    [class.active-row]="isActiveRow(row)"
    [class.playing]="isTrackPlaying(row)"
    (mouseenter)="hoverStart(row)"
    (mouseleave)="hoverEnd(row)"
  ></mat-row>
</mat-table>
