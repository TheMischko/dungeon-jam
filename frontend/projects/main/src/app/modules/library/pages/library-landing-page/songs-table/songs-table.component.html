<app-smart-table
  [config]="tableConfig()"
  [dataSet]="paginatedTracks()"
  [selection]="selection()"
  [allSelectedState]="allSelectedState()"
  [trackBy]="trackByTrackId"
  [uniquenessFn]="uniqueTrackFn"
  [noDataText]="noDataText()"
  [noResultsText]="noSearchResultsText()"
  [loading]="loading()"
  [filterEnabled]="showControls() && showFilters()"
  [showControls]="showControls()"
  [pagination]="paginationConfig()"
  [hiddenColumns]="hiddenColumns()"
  [initialQuery]="initialQuery()"
  (hoverStart)="hoverStart($event)"
  (hoverEnd)="hoverEnd($event)"
  (queryChange)="updateQuery($event)"
  (menuClosed)="actionMenuClosed.emit($event.reason)"
  (selected)="updateSelection($event)"
  (pageChange)="updatePaginationState($event)"
></app-smart-table>

<ng-template #playColumn let-row="$implicit">
  @if (isActiveRow(row) && !isTrackPlaying(row)) {
    <button mat-icon-button (click)="play(row)">
      <svg class="icon-small" [lucideIcon]="PlayIcon"></svg>
    </button>
  } @else if (isTrackPlaying(row)) {
    <button mat-icon-button (click)="pause()">
      <svg class="icon-small" [lucideIcon]="PauseIcon"></svg>
    </button>
  }
</ng-template>

<ng-template #tagColumn let-row="$implicit">
  @if (row.tags) {
    <lib-tag-list-smart
      [tagIds]="row.tags"
      [editable]="false"
      [priorityValue]="currentSearchValue()"
    />
  }
</ng-template>

<ng-template #actionsColumn let-row="$implicit">
  <lib-icon-button
    [matMenuTriggerFor]="menu"
    [icon]="ActionsIcon"
    class="actions-button"
  />
  <mat-menu #menu="matMenu" (closed)="actionMenuClosed.emit($event)">
    <lib-actions-menu [item]="row" [config]="actionsMenuConfig()" />
  </mat-menu>
</ng-template>
