<!-- Search bar -->
<lib-search-bar
  class="search-bar"
  (search)="search.emit($event)"
></lib-search-bar>

<app-table
  [config]="tableConfig"
  [dataSet]="tracks()"
  (hoverStart)="hoverStart($event)"
  (hoverEnd)="hoverEnd($event)"
></app-table>

<ng-template #playColumn let-row="$implicit">
  @if (isActiveRow(row) && !isTrackPlaying(row)) {
  <button mat-icon-button (click)="play(row)">
    <lucide-icon class="icon-small" [img]="PlayIcon"></lucide-icon>
  </button>
  } @else if (isTrackPlaying(row)){
  <button mat-icon-button (click)="pause()">
    <lucide-icon class="icon-small" [img]="PauseIcon"></lucide-icon>
  </button>
  }
</ng-template>

<ng-template #tagColumn let-row="$implicit">
  @if (row.tags){
  <lib-tag-list-smart
    [tagIds]="row.tags"
    [editable]="false"
    [maxShownTags]="2"
  />
  }
</ng-template>

<ng-template #actionsColumn let-row="$implicit">
  <lib-icon-button [matMenuTriggerFor]="menu" [icon]="ActionsIcon" />
  <mat-menu #menu="matMenu" (closed)="actionMenuClosed.emit($event)">
    <lib-actions-menu [item]="row" [config]="actionsMenuConfig()" />
  </mat-menu>
</ng-template>
