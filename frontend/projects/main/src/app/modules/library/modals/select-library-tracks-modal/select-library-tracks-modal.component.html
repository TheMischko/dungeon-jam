<div class="wrapper">
  <div class="header">
    <h1>Select tracks</h1>
  </div>

  <div class="content">
    <app-songs-table
      class="table"
      [tracks]="tracks()"
      [selection]="true"
      [allSelectedState]="selectAllState()"
      [loading]="tracksLoading()"
      [showActionsColumn]="false"
      (queryChange)="tracksQuery.set($event)"
      (selectionChange)="selectionChanged($event)"
    ></app-songs-table>
  </div>

  <div class="footer">
    <div class="footer-button">
      <button mat-flat-button color="neutral" (click)="cancelClick()">
        Cancel
      </button>
      <button mat-flat-button color="primary" (click)="saveSelection()">
        Save
      </button>
    </div>
  </div>
</div>
