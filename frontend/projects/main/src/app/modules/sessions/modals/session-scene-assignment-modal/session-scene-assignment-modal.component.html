<div class="wrapper">
  <div class="header">
    <h1>Select scenes for a session</h1>
  </div>

  <app-session-scene-assignment-modal-content
    [session]="session"
    [assignedScenes]="assignedScenes()"
    [allScenes]="allScenes()"
    [currentSelection]="currentSelection()"
    (selectionChanged)="updateSelection($event)"
  ></app-session-scene-assignment-modal-content>

  <div class="footer">
    <div class="buttons">
      <button mat-flat-button (click)="save()">Save</button>
      <button mat-flat-button (click)="cancel()" color="tertiary">
        Cancel
      </button>
    </div>
  </div>
</div>
