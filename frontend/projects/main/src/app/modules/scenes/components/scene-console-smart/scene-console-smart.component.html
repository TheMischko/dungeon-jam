<app-scene-console
  [scene]="scene()"
  [scenePlaying]="scenePlaying()"
  [playlist]="playlist()"
  [tracks]="tracks()"
  [ambience]="ambience()"
  [stingers]="stingers()"
  [tagsMap]="tagsMap()"
  [sceneImageUrl]="sceneImageUrl()"
  [ambiencePlayMap]="playMap()"
  [stingersPlayMap]="playMap()"
  [playingTrack]="playingTrack()"
  [soundEffectsVolumeMap]="soundEffectsVolumeMap()"
  [viewMode]="viewMode()"
  (changeAmbience)="changeAmbienceSelection()"
  (changeStingers)="changeStingerSelection()"
  (playScene)="playScene()"
  (pauseScene)="stopScene()"
  (playAmbience)="playAmbience()"
  (pauseAmbience)="pauseAmbience()"
  (playAmbienceSoundEffect)="playSoundEffect($event, true)"
  (playStingerSoundEffect)="playSoundEffect($event, false)"
  (pauseSoundEffect)="pauseSoundEffect($event)"
  (changeSoundEffectVolume)="changeSoundEffectVolume($event)"
  (trackQueryChange)="updateTracksQuery($event)"
  (playTrack)="playSceneTrack($event)"
  (pauseTrack)="pauseSceneTrack()"
></app-scene-console>
