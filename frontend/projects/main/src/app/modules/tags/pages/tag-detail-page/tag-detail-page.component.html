<div class="tag-detail-page">
  <div class="title-header">
    <h1>{{ pageTitle() }}</h1>
    <button
      class="tag-color"
      [ngStyle]="tagColorStyle()"
      (click)="openColorPicker()"
    ></button>
    <input
      #colorInput
      type="color"
      class="color-input"
      [value]="tag()?.color"
      (change)="emitNewColor()"
    />
  </div>
  <app-songs-table
    [tracks]="tracks()"
    [loading]="loading()"
    [showFilters]="false"
  ></app-songs-table>
</div>
