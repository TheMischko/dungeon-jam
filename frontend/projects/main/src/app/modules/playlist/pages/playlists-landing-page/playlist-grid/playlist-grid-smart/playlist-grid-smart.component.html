<app-playlist-grid
  [dataSet]="dataSet()"
  [sizeConfig]="sizeConfig()"
  [playingPlaylistId]="playingPlaylistId()"
  (sizeChange)="handleSizeChange($event)"
  (playPlaylist)="playPlaylist($event)"
  (pausePlaylist)="pausePlaylist()"
  (playlistClick)="showPlaylistDetails($event)"
  (search)="searchFilter.set($event)"
></app-playlist-grid>
