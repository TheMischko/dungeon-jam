<app-playlist-grid
  [dataSet]="dataSet()"
  [playlistImageMap]="playlistImageMap()"
  [sizeConfig]="sizeConfig()"
  [sizeSliderValue]="sizeSliderValue() * 100"
  [playingPlaylistId]="playingPlaylistId()"
  [loading]="loading()"
  [showControls]="showControls()"
  [showParentsFilter]="showParentsFilter()"
  [itemPlayable]="itemPlayable()"
  [reorderingEnabled]="reorderingEnabled()"
  [showActions]="showActions()"
  [selectedPlaylistId]="selectedPlaylist()?.id ?? null"
  (sizeChange)="handleSizeChange($event)"
  (playPlaylist)="playPlaylist($event)"
  (pausePlaylist)="pausePlaylist()"
  (playlistClick)="onPlaylistClick($event)"
  (search)="searchFilter.set($event)"
  (reorderDrop)="reorderPlaylist($event)"
  (editPlaylist)="openEditModal($event)"
  (deletePlaylist)="deletePlaylist($event)"
  (parentChange)="updateParent($event)"
></app-playlist-grid>
