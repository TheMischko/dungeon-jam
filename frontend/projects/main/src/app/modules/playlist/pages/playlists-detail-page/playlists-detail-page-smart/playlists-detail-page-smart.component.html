<app-playlists-detail-page
  [playlist]="playlist()"
  [tracks]="tracks()"
  [playingTrackId]="playbackState()?.currentTrack?.id"
  [playlistPlaying]="isPlaylistPlaying()"
  [songActionsMenuConfig]="songActionsMenuConfig()"
  (playPlaylist)="playPlaylist()"
  (playTrack)="playTrack($event)"
  (pause)="pausePlaying()"
  (queryChange)="updateQuery($event)"
  (openAddTracks)="openAddTracksModal()"
></app-playlists-detail-page>
