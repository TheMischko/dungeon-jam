<app-playlists-detail-page
  [playlist]="playlist()"
  [playlistImageUrl]="playlistImageUrl()"
  [tracks]="tracks()"
  [parentPlaylist]="parentPlaylist()"
  [childrenPlaylists]="childPlaylists()"
  [playingTrackId]="playbackState()?.currentTrack?.id"
  [playlistPlaying]="isPlaylistPlaying()"
  [songActionsMenuConfig]="songActionsMenuConfig()"
  (playPlaylist)="playPlaylist()"
  (playTrack)="playTrack($event)"
  (pause)="pausePlaying()"
  (queryChange)="updateQuery($event)"
  (openAddTracks)="openAddTracksModal()"
  (openDiscover)="openDiscoverModal()"
  (includeChildren)="updateIncludeChildren($event)"
  (editPlaylist)="openEditPlaylistModal()"
  (audioDropped)="onTracksDropped($event)"
></app-playlists-detail-page>
