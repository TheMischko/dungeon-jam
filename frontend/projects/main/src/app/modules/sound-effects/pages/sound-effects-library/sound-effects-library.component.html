<h1>Sound Effects</h1>
<mat-slide-toggle [hideIcon]="true" [checked]="true"
  >Show grid</mat-slide-toggle
>
<app-songs-drop-in-zone (dropped)="uploadAudioFiles.emit($event)">
  <app-sound-effect-table
    [soundEffects]="dataset()"
    [loading]="loading()"
    [currentlyPlaying]="playingEffectIds()"
    (playEffect)="playEffect.emit($event)"
    (stopEffect)="stopEffect.emit($event)"
    (toggleEffectLoop)="toggleEffectLoop.emit($event)"
  />
</app-songs-drop-in-zone>
