<h1>Sound Effects</h1>
<app-sound-effect-display-mode-switch [mode]="viewMode()" (modeChange)="toggleViewMode($event)" />
<app-songs-drop-in-zone (audioDropped)="uploadAudioFiles.emit($event)">
  @if (showGrid()) {
    <app-sound-effect-card-grid
      [soundEffects]="dataset()"
      [loading]="loading()"
      [currentlyPlaying]="playingEffectIds()"
      (playEffect)="playEffect.emit($event)"
      (stopEffect)="stopEffect.emit($event)"
      (toggleEffectLoop)="toggleEffectLoop.emit($event)"
      (effectVolumeChange)="effectVolumeChange.emit($event)"
    ></app-sound-effect-card-grid>
  } @else {
    <app-sound-effect-table
      [soundEffects]="dataset()"
      [loading]="loading()"
      [currentlyPlaying]="playingEffectIds()"
      (playEffect)="playEffect.emit($event)"
      (stopEffect)="stopEffect.emit($event)"
      (toggleEffectLoop)="toggleEffectLoop.emit($event)"
    ></app-sound-effect-table>
  }
</app-songs-drop-in-zone>
