<mat-form-field [subscriptSizing]="'dynamic'">
  <mat-label>{{ label() }}</mat-label>
  <mat-select
    [placeholder]="placeholder()"
    (selectionChange)="emitSelection($event)"
    multiple
  >
    @for (option of options(); track trackBy()($index, option)){
    <mat-option [value]="option">{{ option[optionDisplayField()] }}</mat-option>
    }
  </mat-select>
</mat-form-field>
