<div class="wrapper">
  <div class="header">
    <h1>{{ title }}</h1>
  </div>
  <div class="content">
    <div class="message">
      <p>{{ message }}</p>
    </div>
    <div class="footer">
      <button mat-flat-button (click)="confirm()">{{ confirmText }}</button>
      <button mat-flat-button (click)="reject()">{{ dismissText }}</button>
    </div>
  </div>
</div>
