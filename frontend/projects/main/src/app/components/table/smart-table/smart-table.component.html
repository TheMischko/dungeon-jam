<div class="controls">
  <div>Filters</div>
  <lib-search-bar
    class="search-bar"
    (search)="currentSearch.set($event)"
  ></lib-search-bar>
</div>

<app-table
  class="table"
  [config]="config()"
  [dataSet]="dataSet()"
  [selection]="selection()"
  [allSelectedState]="allSelectedState()"
  [actionsFn]="actionsFn()"
  [trackBy]="trackBy()"
  [uniquenessFn]="uniquenessFn()"
  [defaultSortBy]="currentSortBy() ?? ''"
  [defaultSortDirection]="currentSortDirection()"
  (selected)="selected.emit($event)"
  (hoverStart)="hoverStart.emit($event)"
  (hoverEnd)="hoverEnd.emit($event)"
  (sortChange)="setSort($event)"
></app-table>
