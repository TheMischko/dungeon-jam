<div class="sound-effects">
  @for (soundEffect of playingEffects(); track soundEffect.id) {
    <app-sound-effect-bar-pill
      animate.enter="lean-in-animation"
      animate.leave="lean-out-animation"
      [soundEffect]="soundEffect.soundEffect"
      [position]="playingEffectsPositions()?.[soundEffect.id] ?? 0"
      (close)="stopSoundEffect.emit(soundEffect.id)"
      (click)="showDetail.emit($event)"
    />
  }
</div>
